<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Amigo - Adaptive Personal Scheduler that learns from your behavior" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Amigo — Adaptive Personal Scheduler</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0b;
        color: #f0f0f2;
      }
    </style>
    <script>
      (function () {
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            if (window.self !== window.top) {
              window.parent.postMessage({
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
                }
              }, "*");
            }
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
